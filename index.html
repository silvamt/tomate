<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOMATATA - 25:00</title>
    <link rel="icon" id="favicon" href="data:,">
    <style>
        :root {
            --bg-trabalho: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --bg-pausa-curta: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --bg-pausa-longa: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --bg-pronto: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card: rgba(255, 255, 255, 0.94);
            --texto-primario: #1f2933;
            --texto-secundario: #4b5563;
            --roxo: #5a67d8;
            --roxo-escuro: #4c51bf;
            --laranja: #c05621;
            --laranja-escuro: #9c4221;
            --vermelho: #c53030;
            --vermelho-escuro: #9b2c2c;
            --cinza: #4a5568;
            --cinza-escuro: #2d3748;
            --borda: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: var(--bg-pronto);
            transition: background 0.5s ease;
        }

        body.trabalho { background: var(--bg-trabalho); }
        body.pausa-curta { background: var(--bg-pausa-curta); }
        body.pausa-longa { background: var(--bg-pausa-longa); }

        .container {
            text-align: center;
            background: var(--card);
            padding: 32px clamp(20px, 6vw, 40px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.24);
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 30px;
            color: var(--texto-primario);
            letter-spacing: 2px;
        }

        .status {
            font-size: 14px;
            color: var(--texto-secundario);
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer {
            font-size: clamp(52px, 17vw, 72px);
            font-weight: bold;
            margin-bottom: 16px;
            color: var(--texto-primario);
            font-family: "Courier New", monospace;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--borda);
            border-radius: 4px;
            margin: 0 0 22px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #5a67d8, #667eea);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .pomodoros {
            font-size: 18px;
            margin-bottom: 28px;
            color: var(--texto-primario);
        }

        .tomato-icons {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tomato {
            font-size: 22px;
            opacity: 0.28;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .tomato.completed {
            opacity: 1;
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--roxo);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 700;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .controls button {
            flex: 1 1 120px;
        }

        button:hover:not(:disabled) {
            background-color: var(--roxo-escuro);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(90, 103, 216, 0.35);
        }

        button:active:not(:disabled) { transform: translateY(0); }
        button:disabled { opacity: 0.55; cursor: not-allowed; }

        button:focus-visible,
        summary:focus-visible,
        input:focus-visible {
            outline: 3px solid var(--texto-primario);
            outline-offset: 2px;
        }

        button.pausar { background-color: var(--laranja); }
        button.pausar:hover:not(:disabled) { background-color: var(--laranja-escuro); box-shadow: 0 8px 18px rgba(192, 86, 33, 0.35); }

        button.reiniciar { background-color: var(--vermelho); }
        button.reiniciar:hover:not(:disabled) { background-color: var(--vermelho-escuro); box-shadow: 0 8px 18px rgba(197, 48, 48, 0.35); }

        button.secundario { background-color: var(--cinza); }
        button.secundario:hover:not(:disabled) { background-color: var(--cinza-escuro); box-shadow: 0 8px 18px rgba(74, 85, 104, 0.35); }

        .stats {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 2px solid var(--borda);
            font-size: 14px;
            color: var(--texto-secundario);
        }

        .config {
            margin-top: 16px;
            text-align: left;
            font-size: 14px;
            color: var(--texto-secundario);
        }

        .config summary {
            cursor: pointer;
            font-weight: 600;
            text-align: center;
        }

        .config-grid {
            display: grid;
            gap: 10px;
            margin: 14px 0;
        }

        .config-grid label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .config-grid input {
            width: 76px;
            padding: 6px 8px;
            font-size: 15px;
            font-family: inherit;
            border: 1px solid #a0aec0;
            border-radius: 8px;
            color: var(--texto-primario);
            background: #fff;
        }

        .config button {
            width: 100%;
            font-size: 13px;
            padding: 10px 14px;
        }

        .atalhos {
            margin: 14px 0 0;
            font-size: 12px;
            color: var(--texto-secundario);
        }

        kbd {
            font-family: inherit;
            font-weight: 700;
            padding: 1px 6px;
            border: 1px solid #a0aec0;
            border-radius: 5px;
            background: #fff;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍅 TOMATATA</h1>
        <div class="status" id="status" aria-live="polite">Pronto para começar</div>
        <div class="timer" id="timer" role="timer">25:00</div>
        <div class="progress-bar" id="progress-bar" role="progressbar" aria-label="Progresso do período" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="pomodoros">
            <div>Pomodoros concluídos: <strong id="pomodoro-count">0</strong></div>
            <div class="tomato-icons" id="tomato-icons" role="img"></div>
        </div>
        <div class="controls">
            <button type="button" id="btn-iniciar">Iniciar</button>
            <button type="button" id="btn-pausar" class="pausar" disabled>Pausar</button>
            <button type="button" id="btn-pular" class="secundario">Pular</button>
            <button type="button" id="btn-reiniciar" class="reiniciar">Reiniciar</button>
        </div>
        <div class="stats" id="stats">Tempo total focado hoje: 0 min</div>

        <details class="config">
            <summary>⚙️ Configurações</summary>
            <div class="config-grid">
                <label>Foco (min) <input type="number" data-config="foco" min="1" max="120" inputmode="numeric"></label>
                <label>Pausa curta (min) <input type="number" data-config="pausaCurta" min="1" max="120" inputmode="numeric"></label>
                <label>Pausa longa (min) <input type="number" data-config="pausaLonga" min="1" max="120" inputmode="numeric"></label>
                <label>Pomodoros até a pausa longa <input type="number" data-config="ciclo" min="1" max="12" inputmode="numeric"></label>
            </div>
            <button type="button" id="btn-zerar" class="secundario">Zerar estatísticas de hoje</button>
        </details>

        <p class="atalhos"><kbd>Espaço</kbd> iniciar/pausar · <kbd>R</kbd> reiniciar · <kbd>S</kbd> pular</p>
    </div>

    <script>
        const CHAVE_DADOS = "tomatata-data";
        const CHAVE_TIMER = "tomatata-timer";
        const CHAVE_CONFIG = "tomatata-config";

        const CONFIG_PADRAO = { foco: 25, pausaCurta: 5, pausaLonga: 15, ciclo: 4 };
        const LIMITES = { foco: [1, 120], pausaCurta: [1, 120], pausaLonga: [1, 120], ciclo: [1, 12] };

        const PERIODOS = {
            "trabalho": { chave: "foco", emoji: "🍅", rotulo: "Foco total! Trabalhe por" },
            "pausa-curta": { chave: "pausaCurta", emoji: "☕", rotulo: "Pausa curta! Descanse por" },
            "pausa-longa": { chave: "pausaLonga", emoji: "⏰", rotulo: "Pausa longa! Descanse por" }
        };
        const FASES = ["parado", "rodando", "pausado"];
        const CONTEXTOS = ["inicio", "pos-foco", "pos-pausa"];

        const ICONE = "data:image/svg+xml," + encodeURIComponent(
            "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🍅</text></svg>"
        );

        let config = { ...CONFIG_PADRAO };
        let periodo = "trabalho";  // trabalho, pausa-curta, pausa-longa
        let fase = "parado";       // parado, rodando, pausado
        let contexto = "inicio";   // como chegamos neste período: inicio, pos-foco, pos-pausa
        let tempoTotal = 0;
        let restante = 0;
        let fimPrevisto = null;
        let intervalo = null;
        let pomodorosConcluidos = 0;
        let tempoFocadoHoje = 0;
        let diaAtual = new Date().toDateString();
        let audioCtx = null;
        let confirmandoZerar = null;

        const timerDisplay = document.getElementById("timer");
        const statusDisplay = document.getElementById("status");
        const progressBar = document.getElementById("progress-bar");
        const progressFill = document.getElementById("progress");
        const pomodoroCount = document.getElementById("pomodoro-count");
        const tomatoIcons = document.getElementById("tomato-icons");
        const statsDisplay = document.getElementById("stats");
        const btnIniciar = document.getElementById("btn-iniciar");
        const btnPausar = document.getElementById("btn-pausar");
        const btnPular = document.getElementById("btn-pular");
        const btnReiniciar = document.getElementById("btn-reiniciar");
        const btnZerar = document.getElementById("btn-zerar");
        const inputsConfig = document.querySelectorAll("[data-config]");

        document.getElementById("favicon").href = ICONE;

        // ---------- armazenamento ----------

        function lerJSON(chave) {
            try {
                const bruto = localStorage.getItem(chave);
                return bruto ? JSON.parse(bruto) : null;
            } catch {
                return null;
            }
        }

        function gravarJSON(chave, valor) {
            try {
                localStorage.setItem(chave, JSON.stringify(valor));
            } catch {
                // armazenamento indisponível: o app segue funcionando sem persistir
            }
        }

        function valorValido(chave, valor) {
            const [min, max] = LIMITES[chave];
            return Number.isInteger(valor) && valor >= min && valor <= max;
        }

        function carregarConfig() {
            const salvo = lerJSON(CHAVE_CONFIG) || {};
            for (const chave of Object.keys(CONFIG_PADRAO)) {
                config[chave] = valorValido(chave, salvo[chave]) ? salvo[chave] : CONFIG_PADRAO[chave];
            }
        }

        function carregarDados() {
            const dados = lerJSON(CHAVE_DADOS);
            if (dados && dados.data === diaAtual) {
                pomodorosConcluidos = Number(dados.pomodoros) || 0;
                tempoFocadoHoje = Number(dados.tempoFocado) || 0;
            }
        }

        function salvarDados() {
            gravarJSON(CHAVE_DADOS, { data: diaAtual, pomodoros: pomodorosConcluidos, tempoFocado: tempoFocadoHoje });
        }

        function garantirDia() {
            const hoje = new Date().toDateString();
            if (hoje === diaAtual) return;
            diaAtual = hoje;
            pomodorosConcluidos = 0;
            tempoFocadoHoje = 0;
            salvarDados();
            atualizarPomodoros();
            atualizarStats();
        }

        function salvarTimer() {
            gravarJSON(CHAVE_TIMER, { periodo, fase, contexto, tempoTotal, restante, fimPrevisto });
        }

        function carregarTimer() {
            const s = lerJSON(CHAVE_TIMER);
            const valido = s
                && PERIODOS[s.periodo]
                && FASES.includes(s.fase)
                && CONTEXTOS.includes(s.contexto)
                && Number.isFinite(s.tempoTotal) && s.tempoTotal > 0
                && Number.isFinite(s.restante) && s.restante >= 0 && s.restante <= s.tempoTotal
                && (s.fase !== "rodando" || Number.isFinite(s.fimPrevisto));

            if (!valido) {
                definirPeriodo("trabalho", "inicio");
                return;
            }

            periodo = s.periodo;
            fase = s.fase;
            contexto = s.contexto;
            tempoTotal = s.tempoTotal;
            restante = s.restante;
            fimPrevisto = fase === "rodando" ? s.fimPrevisto : null;

            if (fase !== "rodando") return;
            if (fimPrevisto <= Date.now()) {
                finalizarPeriodo({ silencioso: true });
            } else {
                calcularRestante();
                intervalo = setInterval(tick, 250);
            }
        }

        // ---------- som e notificações ----------

        function desbloquearAudio() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                audioCtx = audioCtx || new AudioContextClass();
                if (audioCtx.state === "suspended") audioCtx.resume();
            } catch (e) {
                console.log("Áudio indisponível:", e);
            }
        }

        function emitirSom() {
            desbloquearAudio();
            if (!audioCtx) return;
            const inicio = audioCtx.currentTime + 0.02;
            [660, 880, 1100].forEach((frequencia, i) => {
                const t = inicio + i * 0.25;
                const osc = audioCtx.createOscillator();
                const ganho = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.value = frequencia;
                ganho.gain.setValueAtTime(0.0001, t);
                ganho.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
                ganho.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
                osc.connect(ganho).connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.22);
            });
        }

        function solicitarPermissaoNotificacao() {
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }
        }

        function enviarNotificacao(titulo, corpo) {
            if (!("Notification" in window) || Notification.permission !== "granted") return;
            try {
                new Notification(titulo, { body: corpo, icon: ICONE, tag: "tomatata", renotify: true });
            } catch (e) {
                console.log("Erro ao enviar notificação:", e);
            }
        }

        // ---------- interface ----------

        function minutos(segundos) {
            return Math.round(segundos / 60);
        }

        function duracaoDe(nomePeriodo) {
            return config[PERIODOS[nomePeriodo].chave] * 60;
        }

        function temaAtual() {
            return fase === "parado" && contexto === "inicio" ? "pronto" : periodo;
        }

        function statusTexto() {
            if (fase === "pausado") return "⏸️ Pausado";
            if (fase === "parado" && contexto === "inicio") return "Pronto para começar";
            if (fase === "parado" && contexto === "pos-pausa") return "✅ Intervalo concluído! Pronto para trabalhar?";
            const { emoji, rotulo } = PERIODOS[periodo];
            return `${emoji} ${rotulo} ${minutos(tempoTotal)} minutos`;
        }

        function atualizarTimer() {
            const min = Math.floor(restante / 60);
            const seg = restante % 60;
            const tempoFormatado = `${String(min).padStart(2, "0")}:${String(seg).padStart(2, "0")}`;
            timerDisplay.textContent = tempoFormatado;
            document.title = `TOMATATA - ${tempoFormatado}`;

            const progresso = ((tempoTotal - restante) / tempoTotal) * 100;
            progressFill.style.width = `${progresso}%`;
            progressBar.setAttribute("aria-valuenow", Math.round(progresso));
        }

        function atualizarPomodoros() {
            const cheios = periodo === "pausa-longa" ? config.ciclo : pomodorosConcluidos % config.ciclo;
            pomodoroCount.textContent = pomodorosConcluidos;

            while (tomatoIcons.children.length < config.ciclo) {
                const tomato = document.createElement("span");
                tomato.className = "tomato";
                tomato.textContent = "🍅";
                tomatoIcons.appendChild(tomato);
            }
            while (tomatoIcons.children.length > config.ciclo) {
                tomatoIcons.lastChild.remove();
            }
            Array.from(tomatoIcons.children).forEach((tomato, i) => {
                tomato.classList.toggle("completed", i < cheios);
            });
            tomatoIcons.setAttribute("aria-label", `${cheios} de ${config.ciclo} pomodoros do ciclo`);
        }

        function atualizarStats() {
            const horas = Math.floor(tempoFocadoHoje / 60);
            const mins = tempoFocadoHoje % 60;
            const textoTempo = horas > 0 ? `${horas}h ${mins}min` : `${mins} min`;
            statsDisplay.textContent = `Tempo total focado hoje: ${textoTempo}`;
        }

        function atualizarBotoes() {
            btnIniciar.textContent = fase === "pausado" ? "Continuar" : "Iniciar";
            btnIniciar.disabled = fase === "rodando";
            btnPausar.disabled = fase !== "rodando";
        }

        function render() {
            document.body.className = temaAtual();
            const texto = statusTexto();
            if (statusDisplay.textContent !== texto) statusDisplay.textContent = texto;
            atualizarTimer();
            atualizarPomodoros();
            atualizarBotoes();
        }

        // ---------- ciclo do timer ----------

        function definirPeriodo(novoPeriodo, novoContexto) {
            periodo = novoPeriodo;
            contexto = novoContexto;
            fase = "parado";
            tempoTotal = duracaoDe(periodo);
            restante = tempoTotal;
            fimPrevisto = null;
        }

        function pararTick() {
            clearInterval(intervalo);
            intervalo = null;
        }

        function calcularRestante() {
            if (fase === "rodando") {
                restante = Math.max(0, Math.ceil((fimPrevisto - Date.now()) / 1000));
            }
        }

        function tick() {
            calcularRestante();
            if (restante <= 0) {
                finalizarPeriodo();
            } else {
                atualizarTimer();
            }
        }

        function iniciarPomodoro() {
            if (fase === "rodando") return;
            desbloquearAudio();
            solicitarPermissaoNotificacao();

            fimPrevisto = Date.now() + restante * 1000;
            fase = "rodando";
            intervalo = setInterval(tick, 250);
            salvarTimer();
            render();
        }

        function pausarPomodoro() {
            if (fase !== "rodando") return;
            calcularRestante();
            pararTick();
            fimPrevisto = null;
            fase = "pausado";
            salvarTimer();
            render();
        }

        function alternarPomodoro() {
            if (fase === "rodando") pausarPomodoro();
            else iniciarPomodoro();
        }

        function reiniciarPomodoro() {
            pararTick();
            definirPeriodo("trabalho", "inicio");
            salvarTimer();
            render();
        }

        function pularPeriodo() {
            finalizarPeriodo({ pulado: true });
        }

        function finalizarPeriodo({ pulado = false, silencioso = false } = {}) {
            pararTick();

            if (periodo === "trabalho") {
                if (!pulado) {
                    garantirDia();
                    pomodorosConcluidos++;
                    tempoFocadoHoje += minutos(tempoTotal);
                    salvarDados();
                    atualizarStats();
                }
                const pausaLonga = !pulado && pomodorosConcluidos % config.ciclo === 0;
                definirPeriodo(pausaLonga ? "pausa-longa" : "pausa-curta", "pos-foco");
            } else {
                definirPeriodo("trabalho", "pos-pausa");
            }

            if (!pulado && !silencioso) {
                emitirSom();
                if (periodo === "pausa-longa") {
                    enviarNotificacao("⏰ Parabéns!", `Você completou ${config.ciclo} Pomodoros! Descanse por ${minutos(tempoTotal)} minutos.`);
                } else if (periodo === "pausa-curta") {
                    enviarNotificacao("✅ Pomodoro concluído!", `Faça uma pausa de ${minutos(tempoTotal)} minutos.`);
                } else {
                    enviarNotificacao("🔔 Intervalo concluído!", "Hora de voltar ao trabalho!");
                }
            }

            salvarTimer();
            render();
        }

        // ---------- configurações ----------

        function preencherInputs() {
            inputsConfig.forEach(input => { input.value = config[input.dataset.config]; });
        }

        function aplicarConfig() {
            if (fase === "parado") {
                tempoTotal = duracaoDe(periodo);
                restante = tempoTotal;
                salvarTimer();
            }
            render();
        }

        inputsConfig.forEach(input => {
            input.addEventListener("change", () => {
                const chave = input.dataset.config;
                const [min, max] = LIMITES[chave];
                let valor = Math.round(Number(input.value));
                if (input.value === "" || !Number.isFinite(valor)) valor = config[chave];
                valor = Math.min(max, Math.max(min, valor));
                input.value = valor;
                config[chave] = valor;
                gravarJSON(CHAVE_CONFIG, config);
                aplicarConfig();
            });
        });

        btnZerar.addEventListener("click", () => {
            if (!confirmandoZerar) {
                btnZerar.textContent = "Clique de novo para confirmar";
                confirmandoZerar = setTimeout(restaurarBotaoZerar, 3000);
                return;
            }
            pomodorosConcluidos = 0;
            tempoFocadoHoje = 0;
            salvarDados();
            atualizarStats();
            atualizarPomodoros();
            restaurarBotaoZerar();
        });

        function restaurarBotaoZerar() {
            clearTimeout(confirmandoZerar);
            confirmandoZerar = null;
            btnZerar.textContent = "Zerar estatísticas de hoje";
        }

        // ---------- eventos ----------

        btnIniciar.addEventListener("click", iniciarPomodoro);
        btnPausar.addEventListener("click", pausarPomodoro);
        btnPular.addEventListener("click", pularPeriodo);
        btnReiniciar.addEventListener("click", reiniciarPomodoro);

        document.addEventListener("keydown", (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
            const alvo = e.target instanceof Element ? e.target : document.body;
            if (alvo.closest("input, textarea, select")) return;

            if (e.key === " ") {
                if (alvo.closest("button, summary, a")) return;
                e.preventDefault();
                alternarPomodoro();
            } else if (e.key.toLowerCase() === "r") {
                reiniciarPomodoro();
            } else if (e.key.toLowerCase() === "s") {
                pularPeriodo();
            }
        });

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) return;
            garantirDia();
            if (fase === "rodando") tick();
        });

        // ---------- inicialização ----------

        carregarConfig();
        preencherInputs();
        carregarDados();
        carregarTimer();
        atualizarStats();
        render();
    </script>
</body>
</html>
