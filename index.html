<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOMATATA - 25:00</title>
    <style>
        :root {
            --bg-trabalho: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --bg-pausa-curta: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --bg-pausa-longa: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --bg-pronto: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card: rgba(255, 255, 255, 0.94);
            --texto-primario: #1f2933;
            --texto-secundario: #4b5563;
            --roxo: #5a67d8;
            --roxo-escuro: #4c51bf;
            --laranja: #ed8936;
            --laranja-escuro: #dd6b20;
            --vermelho: #e53e3e;
            --vermelho-escuro: #c53030;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: var(--bg-pronto);
            transition: background 0.5s ease;
        }

        body.trabalho { background: var(--bg-trabalho); }
        body.pausa-curta { background: var(--bg-pausa-curta); }
        body.pausa-longa { background: var(--bg-pausa-longa); }

        .container {
            text-align: center;
            background: var(--card);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.24);
            min-width: 350px;
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 30px;
            color: var(--texto-primario);
            letter-spacing: 2px;
        }

        .status {
            font-size: 14px;
            color: var(--texto-secundario);
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 16px;
            color: var(--texto-primario);
            font-family: "Courier New", monospace;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .pomodoros {
            font-size: 18px;
            margin-bottom: 28px;
            color: var(--texto-primario);
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        .tomato-icons {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            justify-content: center;
        }

        .tomato {
            font-size: 22px;
            opacity: 0.28;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .tomato.completed {
            opacity: 1;
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--roxo);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 700;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            min-width: 120px;
        }

        button:hover:not(:disabled) {
            background-color: var(--roxo-escuro);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(90, 103, 216, 0.35);
        }

        button:active:not(:disabled) { transform: translateY(0); }
        button:disabled { opacity: 0.55; cursor: not-allowed; }

        button.pausar { background-color: var(--laranja); }
        button.pausar:hover:not(:disabled) { background-color: var(--laranja-escuro); }

        button.reiniciar { background-color: var(--vermelho); }
        button.reiniciar:hover:not(:disabled) { background-color: var(--vermelho-escuro); }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            margin-top: 18px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #5a67d8, #667eea);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .stats {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 2px solid #e2e8f0;
            font-size: 14px;
            color: var(--texto-secundario);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 aria-live="polite">🍅 TOMATATA</h1>
        <div class="status" id="status" aria-live="polite">Pronto para começar</div>
        <div class="timer" id="timer" aria-live="polite">25:00</div>
        <div class="progress-bar" aria-hidden="true">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="pomodoros">
            <div>
                <div>Pomodoros concluídos: <strong id="pomodoro-count">0</strong></div>
                <div class="tomato-icons" id="tomato-icons" aria-label="Progresso de pomodoros" role="presentation"></div>
            </div>
        </div>
        <div class="controls">
            <button id="btn-iniciar" onclick="iniciarPomodoro()">Iniciar</button>
            <button id="btn-pausar" class="pausar" onclick="pausarPomodoro()" disabled>Pausar</button>
            <button id="btn-reiniciar" class="reiniciar" onclick="reiniciarPomodoro()">Reiniciar</button>
        </div>
        <div class="stats" id="stats">
            Tempo total focado hoje: 0 min
        </div>
    </div>

    <script>
        const TEMPO_POMODORO = 25 * 60;
        const TEMPO_PAUSA_CURTA = 5 * 60;
        const TEMPO_PAUSA_LONGA = 15 * 60;
        const POMODOROS_PAUSA_LONGA = 4;

        const SOM_COMPLETE = "data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBgoOEhYaHiImKi4yNjo+QkZKTlJWWl5iZmpucnZ6foKGio6SlpqeoqaqrrK2ur7CxsrO0tba3uLm6u7y9vr/AwcLDxMXGx8jJysvMzc7P0NHS09TV1tfY2drb3N3e3+Dh4uPk5ebn6Onq6+zt7u/w8fLz9PX29/j5+vv8/f7/AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8gISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0BBQkNERUZHSElKS0xNTk9QUVJTVFVWV1hZWltcXV5fYGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6e3x9fn+AgYKDhIWGh4iJiouMjY6PkJGSk5SVlpeYmZqbnJ2en6ChoqOkpaanqKmqq6ytrq+wsbKztLW2t7i5uru8vb6/wMHCw8TFxsfIycrLzM3Oz9DR0tPU1dbX2Nna29zd3t/g4eLj5OXm5+jp6uvs7e7v8PHy8/T19vf4+fr7/P3+/w==";

        let tempoRestante = TEMPO_POMODORO;
        let tempoTotal = TEMPO_POMODORO;
        let intervalo = null;
        let emExecucao = false;
        let emIntervalo = false;
        let pomodorosConcluidos = 0;
        let tempoFocadoHoje = 0;
        let estado = "pronto"; // pronto, trabalho, pausa-curta, pausa-longa
        let timestampInicio = null;
        let tempoDecorridoAntes = 0;

        const timerDisplay = document.getElementById("timer");
        const statusDisplay = document.getElementById("status");
        const progressBar = document.getElementById("progress");
        const pomodoroCount = document.getElementById("pomodoro-count");
        const tomatoIcons = document.getElementById("tomato-icons");
        const statsDisplay = document.getElementById("stats");
        const btnIniciar = document.getElementById("btn-iniciar");
        const btnPausar = document.getElementById("btn-pausar");
        const btnReiniciar = document.getElementById("btn-reiniciar");

        function carregarDados() {
            const dados = localStorage.getItem("tomatata-data");
            if (!dados) return;

            const parsed = JSON.parse(dados);
            const hoje = new Date().toDateString();
            if (parsed.data === hoje) {
                pomodorosConcluidos = parsed.pomodoros || 0;
                tempoFocadoHoje = parsed.tempoFocado || 0;
                atualizarPomodoros();
                atualizarStats();
            }
        }

        function salvarDados() {
            const dados = {
                data: new Date().toDateString(),
                pomodoros: pomodorosConcluidos,
                tempoFocado: tempoFocadoHoje
            };
            localStorage.setItem("tomatata-data", JSON.stringify(dados));
        }

        function solicitarPermissaoNotificacao() {
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }
        }

        function enviarNotificacao(titulo, corpo) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(titulo, {
                    body: corpo,
                    icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🍅</text></svg>",
                    tag: "tomatata"
                });
            }
        }

        function emitirSom() {
            const audio = new Audio(SOM_COMPLETE);
            audio.volume = 0.5;
            audio.play().catch(e => console.log("Erro ao reproduzir som:", e));
        }

        function atualizarTimer() {
            const minutos = Math.floor(tempoRestante / 60);
            const segundos = tempoRestante % 60;
            const tempoFormatado = `${String(minutos).padStart(2, "0")}:${String(segundos).padStart(2, "0")}`;
            timerDisplay.textContent = tempoFormatado;
            document.title = `TOMATATA - ${tempoFormatado}`;

            const progresso = ((tempoTotal - tempoRestante) / tempoTotal) * 100;
            progressBar.style.width = `${progresso}%`;
        }

        function calcularTempoRestante() {
            if (!timestampInicio) return;
            const agora = Date.now();
            const tempoDecorrido = Math.floor((agora - timestampInicio) / 1000) + tempoDecorridoAntes;
            tempoRestante = tempoTotal - tempoDecorrido;
            if (tempoRestante < 0) tempoRestante = 0;
        }

        function atualizarStatus(texto) {
            statusDisplay.textContent = texto;
        }

        function atualizarPomodoros() {
            pomodoroCount.textContent = pomodorosConcluidos;
            tomatoIcons.innerHTML = "";
            for (let i = 0; i < POMODOROS_PAUSA_LONGA; i++) {
                const tomato = document.createElement("span");
                tomato.className = "tomato";
                tomato.textContent = "🍅";
                if (i < pomodorosConcluidos % POMODOROS_PAUSA_LONGA) {
                    tomato.classList.add("completed");
                }
                tomatoIcons.appendChild(tomato);
            }
        }

        function atualizarStats() {
            const horas = Math.floor(tempoFocadoHoje / 60);
            const minutos = tempoFocadoHoje % 60;
            const textoTempo = horas > 0 ? `${horas}h ${minutos}min` : `${minutos} min`;
            statsDisplay.textContent = `Tempo total focado hoje: ${textoTempo}`;
        }

        function atualizarTema(novoEstado) {
            document.body.className = novoEstado;
            estado = novoEstado;
        }

        function atualizarBotoes() {
            if (emExecucao) {
                btnIniciar.disabled = true;
                btnPausar.disabled = false;
                btnReiniciar.disabled = false;
            } else {
                btnIniciar.disabled = false;
                btnPausar.disabled = true;
                btnReiniciar.disabled = false;
            }
        }

        function iniciarPomodoro() {
            if (emExecucao) return;

            emExecucao = true;
            solicitarPermissaoNotificacao();

            if (!emIntervalo && estado === "pronto") {
                atualizarTema("trabalho");
                atualizarStatus("🍅 Foco total! Trabalhe por 25 minutos");
            }

            timestampInicio = Date.now();
            atualizarBotoes();

            intervalo = setInterval(() => {
                calcularTempoRestante();
                if (tempoRestante > 0) {
                    atualizarTimer();
                } else {
                    finalizarPeriodo();
                }
            }, 1000);
        }

        function pausarPomodoro() {
            if (!emExecucao) return;

            clearInterval(intervalo);
            intervalo = null;
            emExecucao = false;

            if (timestampInicio) {
                const agora = Date.now();
                tempoDecorridoAntes += Math.floor((agora - timestampInicio) / 1000);
                timestampInicio = null;
            }

            atualizarStatus("⏸️ Pausado");
            atualizarBotoes();
        }

        function reiniciarPomodoro() {
            clearInterval(intervalo);
            intervalo = null;
            emExecucao = false;
            emIntervalo = false;
            tempoRestante = TEMPO_POMODORO;
            tempoTotal = TEMPO_POMODORO;
            timestampInicio = null;
            tempoDecorridoAntes = 0;
            atualizarTema("pronto");
            atualizarStatus("Pronto para começar");
            atualizarTimer();
            atualizarBotoes();
        }

        function finalizarPeriodo() {
            clearInterval(intervalo);
            intervalo = null;
            emExecucao = false;
            timestampInicio = null;
            tempoDecorridoAntes = 0;
            emitirSom();

            if (!emIntervalo) {
                pomodorosConcluidos++;
                tempoFocadoHoje += 25;
                atualizarPomodoros();
                atualizarStats();
                salvarDados();

                if (pomodorosConcluidos % POMODOROS_PAUSA_LONGA === 0) {
                    tempoRestante = TEMPO_PAUSA_LONGA;
                    tempoTotal = TEMPO_PAUSA_LONGA;
                    atualizarTema("pausa-longa");
                    atualizarStatus("⏰ Pausa longa! Descanse por 15 minutos");
                    enviarNotificacao("⏰ Parabéns!", `Você completou ${POMODOROS_PAUSA_LONGA} Pomodoros! Descanse por 15 minutos.`);
                } else {
                    tempoRestante = TEMPO_PAUSA_CURTA;
                    tempoTotal = TEMPO_PAUSA_CURTA;
                    atualizarTema("pausa-curta");
                    atualizarStatus("☕ Pausa curta! Descanse por 5 minutos");
                    enviarNotificacao("✅ Pomodoro concluído!", "Faça uma pausa de 5 minutos.");
                }
                emIntervalo = true;
            } else {
                tempoRestante = TEMPO_POMODORO;
                tempoTotal = TEMPO_POMODORO;
                emIntervalo = false;
                atualizarTema("trabalho");
                atualizarStatus("✅ Intervalo concluído! Pronto para trabalhar?");
                enviarNotificacao("🔔 Intervalo concluído!", "Hora de voltar ao trabalho!");
            }

            atualizarTimer();
            atualizarBotoes();
        }

        document.addEventListener("visibilitychange", () => {
            if (!document.hidden && emExecucao) {
                calcularTempoRestante();
                atualizarTimer();
                if (tempoRestante <= 0) {
                    finalizarPeriodo();
                }
            }
        });

        carregarDados();
        atualizarTimer();
        atualizarPomodoros();
        atualizarStats();
        atualizarBotoes();
    </script>
</body>
</html>
